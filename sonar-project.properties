# SonarQube / SonarCloud analysis of the sandbox platform (backend + ui).
# Run from the repository root, after both coverage reports exist:
#   cd backend && python -m pytest --cov=app --cov-report=xml:coverage.xml && cd ..
#   cd ui && npm run test:coverage && cd ..
#   sonar-scanner -Dsonar.host.url=<server> -Dsonar.token=<token>
sonar.projectKey=oan-sandbox-platform
sonar.projectName=OAN Sandbox Platform
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,backend/scripts,backend/alembic,ui/src
sonar.tests=backend/tests,ui/src
sonar.test.inclusions=backend/tests/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,backend/alembic/versions/**,backend/app/seeds/**,ui/public/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# TypeScript (Vitest, ui/vitest.config.mts)
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info

# Next.js route files (pages, layouts) are screens, checked end to end rather than
# by unit tests; they are still analysed for bugs, vulnerabilities and smells.
sonar.coverage.exclusions=ui/src/app/**,ui/src/types/**,backend/scripts/**,backend/alembic/**

# Seed data and migrations are generated, not hand-written logic.
sonar.cpd.exclusions=backend/app/seeds/**,backend/alembic/versions/**
