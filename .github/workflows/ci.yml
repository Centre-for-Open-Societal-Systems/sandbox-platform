name: CI

# Checks every push and pull request: backend lint + tests, UI type-check,
# lint and build, and both Docker images build. Nothing is published.

on:
  push:
    branches: ["main", "staging", "develop"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      # Tests use an in-memory SQLite database (tests/conftest.py); no Postgres needed.
      - run: pytest

  ui:
    name: UI (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox-api
        run: docker build -f docker/sandbox-api/Dockerfile -t sandbox-api:ci .
      - name: Build sandbox-ui
        run: docker build -t sandbox-ui:ci ui
