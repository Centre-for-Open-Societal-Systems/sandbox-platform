# Hand-written, not generated: generate_k8s_chart.py writes only apisix-route.yaml and
# apisix-upstream.yaml. Same shape as the grievance chart's ApisixTls.
# Apps share the gateway and are told apart by host, so every route needs `hosts`.
{{- if not .Values.hosts }}
{{- fail "hosts is required: the public host names partners call" }}
{{- end }}
# APISIX terminates TLS for `hosts` with Secret `tls.secretName` (tls.crt, tls.key) in the
# release namespace.
{{- if and .Values.tls .Values.tls.secretName }}
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: oan-partner-gateway-tls
  labels:
    app: oan-partner-gateway
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  hosts:
{{- range .Values.hosts }}
  - {{ . | quote }}
{{- end }}
  secret:
    name: {{ .Values.tls.secretName | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
