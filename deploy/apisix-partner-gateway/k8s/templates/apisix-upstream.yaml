# OAN partner APIs (sandbox apps, GATEWAY_PARTNER_AUTH=oauth): APISIX Ingress Controller resources.
# Generated by deploy/apisix-partner-gateway/generate_k8s_chart.py from partner-apis.adc.yaml -- do not hand-edit;
# change build_apisix_config.py and re-run.
{{- if .Values.consentManager.portalApi.enabled }}
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: consent-manager-partner-portal-api
  labels:
    app: oan-partner-gateway
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  externalNodes:
  - type: Domain
    name: {{ required "consentManager.portalApi.host is required" .Values.consentManager.portalApi.host }}
    port: 443
  scheme: https
  passHost: node
  retries: 1
  timeout:
    connect: 10s
    send: 30s
    read: 30s
{{- end }}
