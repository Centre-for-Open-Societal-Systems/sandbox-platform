# OAN partner APIs (sandbox apps, GATEWAY_PARTNER_AUTH=oauth): APISIX Ingress Controller resources.
# Generated by deploy/apisix-partner-gateway/generate_k8s_chart.py from farmer-registry.adc.yaml -- do not hand-edit;
# change build_apisix_config.py and re-run.
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: farmer-registry-staff-api
  labels:
    app: oan-partner-gateway
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  externalNodes:
  - type: Domain
    name: {{ required "farmerRegistry.upstreamHost is required" .Values.farmerRegistry.upstreamHost }}
    port: 443
  scheme: https
  passHost: node
  retries: 1
  timeout:
    connect: 10s
    send: 30s
    read: 30s
---
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: farmer-registry-token
  labels:
    app: oan-partner-gateway
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  externalNodes:
  - type: Domain
    name: {{ required "farmerRegistry.keycloakHost is required" .Values.farmerRegistry.keycloakHost }}
    port: 443
  scheme: https
  passHost: node
  retries: 1
  timeout:
    connect: 10s
    send: 30s
    read: 30s
