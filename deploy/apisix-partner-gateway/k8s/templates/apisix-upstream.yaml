{{- if .Values.consentManager.portalApi.enabled }}
{{- $own := .Values.consentManager.portalApi.upstreamTls | default dict }}
{{- $tlsName := $own.secretName | default .Values.upstreamTls.secretName }}
{{- $tlsNamespace := $own.namespace | default .Values.upstreamTls.namespace | default .Release.Namespace }}
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: consent-manager-partner-portal-api
  labels:
    app: oan-partner-gateway
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  externalNodes:
  - type: Domain
    name: {{ required "consentManager.portalApi.host is required" .Values.consentManager.portalApi.host }}
    port: 443
  scheme: https
  passHost: node
  retries: 1
  timeout:
    connect: 10s
    send: 30s
    read: 30s
{{- if $tlsName }}
  # mTLS: APISIX presents this client certificate (tls.crt, tls.key) to the upstream,
  # whose edge accepts partner calls only with it, so partners cannot skip the gateway.
  tlsSecret:
    name: {{ $tlsName | quote }}
    namespace: {{ $tlsNamespace | quote }}
{{- end }}
{{- end }}
