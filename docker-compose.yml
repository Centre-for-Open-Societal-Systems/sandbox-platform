# OAN Sandbox in Docker: PostgreSQL, API and web.
#
#   browser --> web (Next.js) :3005 --> api (FastAPI) :8010 --> postgres :5433 (host) / 5432 (network)
#                                          |
#                                          +--> existing APISIX gateway (GATEWAY_UAT_URL)
#
# The API gateway is NOT part of this stack: the API calls the Apache APISIX
# already deployed for the environment. (For a laptop without one, run a local
# gateway on its own - see DEPLOYMENT.md.)
#
#   cp .env.example .env      # passwords, secrets, public URLs, GATEWAY_UAT_URL
#   docker compose up -d --build
#
# On the first start PostgreSQL loads deployment/postgres/initdb/*.sql.gz (the
# sandbox data: catalogue, masters, CMS, accounts); the api container then
# applies any newer migrations. See DEPLOYMENT.md.
name: oan-sandbox

services:
  postgres:
    # Same major version as the source database the init dump was taken from.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-sandbox_db_oan}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/...
      - oan_pgdata:/var/lib/postgresql
      # Runs only when the data volume is empty (first start). Point
      # POSTGRES_INITDB_DIR at ./deployment/postgres/empty for a clean database.
      - ${POSTGRES_INITDB_DIR:-./deployment/postgres/initdb}:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only by default; set POSTGRES_BIND=0.0.0.0 to reach it from other hosts.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/sandbox-api/Dockerfile
    image: ${IMAGE_PREFIX:-oan-sandbox}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ENV: ${APP_ENV:-sandbox}
      # true exposes Swagger at /docs; keep false on shared servers.
      DEBUG: ${API_DEBUG:-false}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-ET}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-sandbox_db_oan}
      JWT_ACCESS_TOKEN_KEY: ${JWT_ACCESS_TOKEN_KEY:?set JWT_ACCESS_TOKEN_KEY in .env}
      JWT_REFRESH_TOKEN_KEY: ${JWT_REFRESH_TOKEN_KEY:?set JWT_REFRESH_TOKEN_KEY in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3005}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3005}
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@openagrinet.org}
      SMTP_TLS: ${SMTP_TLS:-true}
      # Sign-up code used while mail is off (see .env.example).
      DEV_FIXED_OTP: ${DEV_FIXED_OTP:-}
      GATEWAY_ENABLED: ${GATEWAY_ENABLED:-true}
      # The APISIX proxy already deployed for this environment (not started here).
      GATEWAY_UAT_URL: ${GATEWAY_UAT_URL:?set GATEWAY_UAT_URL to the deployed APISIX proxy URL in .env}
      GATEWAY_PROD_URL: ${GATEWAY_PROD_URL:-}
      # Same gateway as partners reach it (code samples, try-it URL); empty = the URL above.
      GATEWAY_UAT_PUBLIC_URL: ${GATEWAY_UAT_PUBLIC_URL:-}
      GATEWAY_PROD_PUBLIC_URL: ${GATEWAY_PROD_PUBLIC_URL:-}
      # "Pull from gateway" in the console (off unless set; see .env.example).
      GATEWAY_SYNC_ENABLED: ${GATEWAY_SYNC_ENABLED:-false}
      GATEWAY_TYPE: ${GATEWAY_TYPE:-apisix}
      GATEWAY_ADMIN_URL: ${GATEWAY_ADMIN_URL:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_PROD_ADMIN_URL: ${GATEWAY_PROD_ADMIN_URL:-}
      GATEWAY_PROD_ADMIN_TOKEN: ${GATEWAY_PROD_ADMIN_TOKEN:-}
      # Participant apps -> gateway consumers (needs write access on the Admin API).
      GATEWAY_APP_SYNC_ENABLED: ${GATEWAY_APP_SYNC_ENABLED:-false}
      GATEWAY_APP_KEY_HEADER: ${GATEWAY_APP_KEY_HEADER:-apikey}
      GATEWAY_PARTNER_AUTH: ${GATEWAY_PARTNER_AUTH:-apikey}
      GATEWAY_PARTNER_TOKEN_HEADER: ${GATEWAY_PARTNER_TOKEN_HEADER:-X-Partner-Token}
      APP_CREDENTIAL_ENCRYPTION_KEY: ${APP_CREDENTIAL_ENCRYPTION_KEY:-}
      MAX_APPS_PER_PARTICIPANT: ${MAX_APPS_PER_PARTICIPANT:-10}
      MAX_ACTIVE_CREDENTIALS_PER_APP: ${MAX_ACTIVE_CREDENTIALS_PER_APP:-2}
      APP_KEY_LIFETIME_DAYS: ${APP_KEY_LIFETIME_DAYS:-0}
      APP_KEY_ROTATION_GRACE_DAYS: ${APP_KEY_ROTATION_GRACE_DAYS:-7}
      APP_KEY_EXPIRY_WARN_DAYS: ${APP_KEY_EXPIRY_WARN_DAYS:-14}
      APP_KEY_MAINTENANCE_MINUTES: ${APP_KEY_MAINTENANCE_MINUTES:-60}
      SUPPORT_SLA_HOURS: ${SUPPORT_SLA_HOURS:-72}
      SUPPORT_NOTIFY_EMAIL: ${SUPPORT_NOTIFY_EMAIL:-}
      SUPPORT_AUTO_CLOSE_DAYS: ${SUPPORT_AUTO_CLOSE_DAYS:-0}
      SUPPORT_MAX_MESSAGES_PER_TICKET: ${SUPPORT_MAX_MESSAGES_PER_TICKET:-100}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-0}
      MAX_ALLOWED_IPS_PER_APP: ${MAX_ALLOWED_IPS_PER_APP:-20}
      # Gateway logs callback and rate limits (see .env.example).
      GATEWAY_LOG_INGEST_ENABLED: ${GATEWAY_LOG_INGEST_ENABLED:-false}
      GATEWAY_LOG_INGEST_URL: ${GATEWAY_LOG_INGEST_URL:-}
      GATEWAY_LOG_INGEST_TOKEN: ${GATEWAY_LOG_INGEST_TOKEN:-}
      GATEWAY_LOG_FLUSH_SECONDS: ${GATEWAY_LOG_FLUSH_SECONDS:-5}
      GATEWAY_RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-false}
      GATEWAY_RATE_LIMIT_POLICY: ${GATEWAY_RATE_LIMIT_POLICY:-local}
      GATEWAY_RATE_LIMIT_REDIS_HOST: ${GATEWAY_RATE_LIMIT_REDIS_HOST:-}
      GATEWAY_RATE_LIMIT_REDIS_PORT: ${GATEWAY_RATE_LIMIT_REDIS_PORT:-6379}
      GATEWAY_RATE_LIMIT_REDIS_PASSWORD: ${GATEWAY_RATE_LIMIT_REDIS_PASSWORD:-}
      # Partner OAuth2 clients in Keycloak (see .env.example).
      KEYCLOAK_PROVISIONING_ENABLED: ${KEYCLOAK_PROVISIONING_ENABLED:-false}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-oan-partners}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-oan-sandbox-provisioner}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_ENVIRONMENTS: ${KEYCLOAK_ENVIRONMENTS:-UAT,PRODUCTION}
      KEYCLOAK_PARTNER_CLIENT_ID: ${KEYCLOAK_PARTNER_CLIENT_ID:-oan-partner-api}
      KEYCLOAK_PROD_URL: ${KEYCLOAK_PROD_URL:-}
      KEYCLOAK_PROD_PUBLIC_URL: ${KEYCLOAK_PROD_PUBLIC_URL:-}
      KEYCLOAK_PROD_REALM: ${KEYCLOAK_PROD_REALM:-}
      KEYCLOAK_PROD_ADMIN_CLIENT_ID: ${KEYCLOAK_PROD_ADMIN_CLIENT_ID:-}
      KEYCLOAK_PROD_ADMIN_CLIENT_SECRET: ${KEYCLOAK_PROD_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_PROD_JWKS_URL: ${KEYCLOAK_PROD_JWKS_URL:-}
      KEYCLOAK_PORTAL_CLIENT_ID: ${KEYCLOAK_PORTAL_CLIENT_ID:-}
      KEYCLOAK_PORTAL_ROLE: ${KEYCLOAK_PORTAL_ROLE:-PARTNER_OPERATOR}
      KEYCLOAK_PARTNER_ID_ATTRIBUTE: ${KEYCLOAK_PARTNER_ID_ATTRIBUTE:-partner_id}
      PARTNER_ID_PREFIX: ${PARTNER_ID_PREFIX:-oan-p-}
      PARTICIPANT_AUTH_PROVIDER: ${PARTICIPANT_AUTH_PROVIDER:-local}
      KEYCLOAK_LOGIN_CLIENT_ID: ${KEYCLOAK_LOGIN_CLIENT_ID:-oan-sandbox-portal}
      KEYCLOAK_LOGIN_CLIENT_SECRET: ${KEYCLOAK_LOGIN_CLIENT_SECRET:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      KEYCLOAK_TOKEN_LEEWAY_SECONDS: ${KEYCLOAK_TOKEN_LEEWAY_SECONDS:-30}
      KEYCLOAK_JWKS_CACHE_SECONDS: ${KEYCLOAK_JWKS_CACHE_SECONDS:-300}
      PM_PROVISIONING_ENABLED: ${PM_PROVISIONING_ENABLED:-false}
      PM_STAFF_API_URL: ${PM_STAFF_API_URL:-}
      PM_TOKEN_URL: ${PM_TOKEN_URL:-}
      PM_CLIENT_ID: ${PM_CLIENT_ID:-oan-sandbox-pm}
      PM_CLIENT_SECRET: ${PM_CLIENT_SECRET:-}
      PM_TIMEOUT: ${PM_TIMEOUT:-15}
      PM_PARTNER_JWKS_BASE_URL: ${PM_PARTNER_JWKS_BASE_URL:-}
      PM_DEFAULT_POLICIES: ${PM_DEFAULT_POLICIES:-[]}
      # Off: try-it calls only go through the gateway (no answers from stored samples).
      SANDBOX_MOCK_RESPONSES: ${SANDBOX_MOCK_RESPONSES:-false}
      # Only needed for an empty database (see DEPLOYMENT.md, "Start from a clean database").
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@openagrinet.org}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      LOAD_DEMO_CATALOGUE: ${LOAD_DEMO_CATALOGUE:-false}
      A2C_SPEC_PATH: /a2c/openapi_v1.public.yaml
      FARMER_REGISTRY_COLLECTION_PATH: /farmer-registry/farmer_registry.postman_collection.json
    volumes:
      - oan_uploads:/app/uploads
      - oan_api_logs:/app/logs
      # Only the A2C OpenAPI file, read by LOAD_DEMO_CATALOGUE; no gateway runs from it.
      - ./deployment/a2c:/a2c:ro
      # Farmer Registry Postman collection, read by LOAD_DEMO_CATALOGUE.
      - ./deployment/farmer-registry:/farmer-registry:ro
    extra_hosts:
      # Lets GATEWAY_UAT_URL point at a gateway on the Docker host
      # (e.g. http://host.docker.internal:9080) when testing on a laptop.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8010}:8000"

  web:
    build:
      context: ./ui
      args:
        # The browser calls this URL, so it must be reachable from users' machines.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8010/oan}
        NEXT_PUBLIC_DEFAULT_COUNTRY: ${DEFAULT_COUNTRY_CODE:-ET}
        NEXT_PUBLIC_SITE_NAME: ${SITE_NAME:-EOAN}
    image: ${IMAGE_PREFIX:-oan-sandbox}-web:${IMAGE_TAG:-latest}
    environment:
      # The Next.js server renders public pages (catalogue, FAQs, home) and must
      # reach the API over the Docker network, not the browser URL above.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000/oan}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3005}:3000"

volumes:
  oan_pgdata:
  oan_uploads:
  oan_api_logs:
