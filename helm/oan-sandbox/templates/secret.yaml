{{- /*
Secret <secret.name>, made by the chart when secret.create is true (as oan_a2c_service's chart makes its
admin, secret-key and JWT Secrets). Generated once and reused on every upgrade (lookup):

  DB_PASSWORD                    password of role config.db.user (dbInit sets it on the database)
  JWT_ACCESS_TOKEN_KEY           HS256 key of portal access tokens
  JWT_REFRESH_TOKEN_KEY          HS256 key of refresh tokens (differs from the access key)
  APP_CREDENTIAL_ENCRYPTION_KEY  Fernet key of stored app credentials; never change it

Every other key already in the Secret is kept as it is, so the ones only an operator can supply
(KEYCLOAK_LOGIN_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET, GATEWAY_ADMIN_TOKEN, SMTP_PASSWORD, ...)
are added once with `kubectl patch` and survive upgrades. Kept on uninstall (helm.sh/resource-policy:
keep): a new JWT key logs everyone out, a new Fernet key makes stored app credentials unreadable.
helm template and --dry-run cannot see the cluster, so they render fresh values.
*/ -}}
{{- if .Values.secret.create }}
{{- $name := required "secret.name is required with secret.create" .Values.secret.name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}
{{- $data = deepCopy $existing.data }}
{{- end }}
{{- $generated := dict
      "DB_PASSWORD" (randAlphaNum 32)
      "JWT_ACCESS_TOKEN_KEY" (randAlphaNum 64)
      "JWT_REFRESH_TOKEN_KEY" (randAlphaNum 64)
      "APP_CREDENTIAL_ENCRYPTION_KEY" (randBytes 32 | replace "+" "-" | replace "/" "_") }}
{{- range $key, $value := $generated }}
{{- if not (hasKey $data $key) }}
{{- $_ := set $data $key ($value | b64enc) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
{{- end }}
