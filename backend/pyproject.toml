[project]
name = "oan-sandbox-backend"
version = "1.0.0"
description = "Open Agri Net developer sandbox API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplifications
    "C4",   # comprehensions
]
ignore = [
    "B008",  # FastAPI dependencies are function calls in argument defaults
    "E501",  # line length is handled by the formatter
    "UP046", # Generic[T] is kept for Pydantic generic model compatibility
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]      # forward references in Mapped[] annotations
"app/seeds/*.py" = ["E501"]       # seeded copy stays readable as written
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
